<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,500..800&family=Geist:wght@400..700&family=Geist+Mono:wght@400..600&display=swap">
<title>Meridian</title>
<script>
  // Apply the saved theme before first paint. "auto" follows the system setting.
  (function () {
    var t = null;
    try { t = localStorage.getItem('meridian-theme'); } catch (e) {}
    if (t === 'light' || t === 'dark') document.documentElement.dataset.theme = t;
  })();
</script>
<link rel="stylesheet" href="/static/css/styles.css">
</head>
<body>
<div id="app"></div>
<div id="toast-root"></div>
<div id="assistant-root"></div>
<script type="module" src="/static/js/main.js"></script>
</body>
</html>
